services:
  db:
    image: postgres:16-alpine
    container_name: mganik_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mganik-inventory
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5433 → container port 5432
      # Hindari konflik dengan PostgreSQL lokal yang sudah berjalan di port 5432
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d mganik-inventory']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: mganik_backend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      # Connect ke service 'db' via internal Docker network (port 5432, bukan 5433)
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/mganik-inventory"
      NODE_ENV: production
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/log:/app/log

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: mganik_frontend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PORT: '3000'
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  postgres_data:
